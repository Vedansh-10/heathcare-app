server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: healthcare-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcare_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Postgre@10}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: HealthcareHikariPool

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

#  cache:
#    cache-manager: cacheManager
#    jackson:
#      objectMapper: objectMapper

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-openai-api-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
          max-tokens: 1024

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    filter: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: AI Healthcare Assistant
    version: 1.0.0

logging:
  level:
    root: INFO
    com.healthcare: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_SQL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/healthcare-backend.log

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  emergency:
    keywords: >
      chest pain,breathing difficulty,unconscious,heavy bleeding,stroke,heart attack,
      seizure,overdose,cannot breathe,stopped breathing,severe chest,heart failure,
      anaphylaxis,severe allergic,suicidal,self harm,loss of consciousness,unresponsive,
      choking,severe burn,amputation,poisoning
